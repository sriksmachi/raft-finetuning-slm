name: slm-studio-inference
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.9,<2.10
      - azureml-inference-server-http
      - azureml-mlflow
      - accelerate
      - mlflow
      - numpy
      - sentencepiece
      - transformers==4.57.1
      - bitsandbytes
      - unsloth
      - azure-identity
      - azure-storage-blob
      - azure-ai-ml>=1.26,<2
      - azure-keyvault-secrets>=4,<5
      - azureml-ai-monitoring
      - openai
      - deepeval>=3.9.9,<4
      - pandas
      - tqdm
