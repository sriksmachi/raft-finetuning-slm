<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>RAFT for Domain-Specific RAG | Tech Talk with Sriks</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="theme">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

	<style>
		:root {
			--bg: #071018;
			--panel: rgba(10, 24, 36, 0.82);
			--panel-strong: rgba(8, 18, 28, 0.92);
			--cyan: #4fc3f7;
			--cyan-soft: rgba(79, 195, 247, 0.18);
			--gold: #ffd54f;
			--green: #7ddc91;
			--text: #f4f8fb;
			--muted: #b5c4d3;
			--line: rgba(79, 195, 247, 0.28);
			--banner: url('https://yt3.googleusercontent.com/Z9AX8lhKU5QyQyW4XErPB5hvXN8ZOmgA-0y-UxFrVKDazjqiYJbghJ1jZhAGjDQ1XHOTsjN3KQ=w1060-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj');
			--avatar: url('https://yt3.googleusercontent.com/VfLtrBrivxOnkg-xenA5l-72VeVHUti8gHVskhyq1s5PCUHRzQH1EF50XV4-9D8hAmCtQmj85A=s120-c-k-c0x00ffffff-no-rj');
		}

		body { background: var(--bg); }

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			background:
				repeating-linear-gradient(90deg, rgba(79, 195, 247, 0.045) 0 1px, transparent 1px 96px),
				repeating-linear-gradient(0deg, rgba(79, 195, 247, 0.035) 0 1px, transparent 1px 96px);
			mask-image: linear-gradient(to bottom, transparent, black 16%, black 86%, transparent);
		}

		.reveal {
			font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 34px;
			color: var(--text);
		}

		.reveal::before {
			content: "Tech Talk with Sriks";
			position: fixed;
			top: 20px;
			left: 30px;
			z-index: 20;
			display: flex;
			align-items: center;
			min-height: 48px;
			padding-left: 62px;
			font-size: 19px;
			font-weight: 800;
			color: var(--text);
			background: var(--avatar) left center / 48px 48px no-repeat;
			text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
		}

		.reveal::after {
			content: "Data Science | AI-ML | LLMs";
			position: fixed;
			right: 30px;
			bottom: 22px;
			z-index: 20;
			font-size: 17px;
			font-weight: 700;
			color: var(--muted);
		}

		.reveal .slides { text-align: left; }

		.reveal .slides > section {
			box-sizing: border-box;
			height: 100%;
			display: flex !important;
			flex-direction: column;
			justify-content: flex-start;
			padding: 1.55em 1.18em 1.05em;
			background: linear-gradient(120deg, rgba(7, 16, 24, 0.98), rgba(12, 35, 52, 0.9));
			border-left: 6px solid var(--cyan);
			box-shadow: inset 0 1px 0 var(--line);
		}

		.reveal .slides > section:first-child {
			justify-content: center;
			background:
				var(--banner) right 1.18em center / 42% auto no-repeat,
				linear-gradient(90deg, rgba(7, 16, 24, 0.92), rgba(7, 16, 24, 0.74)),
				var(--bg);
			border-left-color: var(--gold);
		}

		.reveal .slides > section:first-child > :not(aside) { max-width: 48%; }

		.reveal h1,
		.reveal h2,
		.reveal h3 {
			letter-spacing: 0;
			text-transform: none;
		}

		.reveal h1 {
			max-width: 13ch;
			font-size: 1.95em;
			font-weight: 850;
			color: var(--cyan);
		}

		.reveal h2 {
			margin: 0 0 0.58em;
			font-size: 1.22em;
			font-weight: 800;
			color: var(--cyan);
		}

		.reveal h3 { color: var(--gold); }
		.reveal p { margin: 0.34em 0; }
		.reveal p, .reveal li { color: var(--text); line-height: 1.24; }
		.reveal section > p,
		.reveal section > ul,
		.reveal section > ol { font-size: 1em; }
		.reveal strong { color: var(--gold); }
		.reveal ul, .reveal ol { margin: 0.35em 0 0.35em 1.05em; }
		.reveal li { margin: 0.18em 0; }
		.reveal code { color: var(--gold); background: rgba(255, 213, 79, 0.12); }
		.reveal pre {
			width: 100%;
			margin: 0.15em 0 0.5em;
			box-shadow: none;
		}
		.reveal pre code {
			max-height: none;
			padding: 0.75em 0.9em;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-strong);
			font-size: 0.5em;
			line-height: 1.18;
			color: var(--text);
		}
		.reveal .duration { color: var(--green); font-size: 0.72em; font-weight: 800; }

		.reveal table {
			width: 100%;
			margin: 0.35em 0;
			border-collapse: collapse;
			font-size: 0.54em;
			color: var(--text);
		}

		.reveal table th,
		.reveal table td {
			padding: 0.46em 0.62em;
			border: 1px solid rgba(79, 195, 247, 0.2);
			vertical-align: top;
		}

		.reveal table th {
			color: var(--gold);
			background: rgba(79, 195, 247, 0.1);
			font-weight: 800;
		}

		.reveal .flow-grid,
		.reveal .answer-grid {
			flex: 1 1 auto;
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 0.56em;
			margin: 0.5em 0 0.58em;
		}

		.reveal .flow-grid div,
		.reveal .answer-grid article {
			display: flex;
			flex-direction: column;
			padding: 0.68em;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
			box-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
		}

		.reveal .flow-grid div {
			min-height: 5.8em;
			font-size: 0.54em;
			line-height: 1.28;
		}

		.reveal .answer-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.reveal .answer-grid article { min-height: 8.8em; }

		.reveal .answer-grid article span {
			align-self: flex-start;
			display: inline-block;
			margin-bottom: 0.55em;
			padding: 0.16em 0.58em;
			border: 1px solid rgba(255, 213, 79, 0.45);
			border-radius: 999px;
			color: var(--gold);
			font-size: 0.42em;
			font-weight: 800;
			text-transform: uppercase;
		}

		.reveal .answer-grid article h3 {
			margin: 0 0 0.45em;
			font-size: 0.68em;
			overflow-wrap: anywhere;
		}

		.reveal .answer-grid article p {
			margin: 0;
			font-size: 0.56em;
			line-height: 1.28;
		}

		.reveal .question-callout {
			margin: 0 0 0.62em;
			padding: 0.62em 0.78em;
			border-left: 4px solid var(--gold);
			border-radius: 8px;
			background: var(--cyan-soft);
			font-size: 0.7em;
		}

		.reveal .compact-slide h2 { font-size: 1.06em; margin-bottom: 0.42em; }
		.reveal .compact-slide > p { font-size: 0.82em; }
		.reveal .compact-slide > ul,
		.reveal .compact-slide > ol { font-size: 0.78em; }
		.reveal .compact-slide li { margin: 0.12em 0; line-height: 1.16; }

		.reveal .progress { color: var(--cyan); }
		.reveal .slide-number { color: var(--muted); background: transparent; }
	</style>
</head>
<body>
	<div class="reveal">
		<div class="slides">
			<section data-markdown="slides.md"
			         data-separator="^---$"
			         data-separator-vertical="^--$"
			         data-charset="utf-8">
			</section>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

	<script>
		Reveal.initialize({
			width: 1200,
			height: 675,
			margin: 0.03,
			center: false,
			minScale: 0.2,
			maxScale: 2.0,
			hash: true,
			slideNumber: 'c/t',
			transition: 'slide',
			plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
		});
	</script>
</body>
</html>
