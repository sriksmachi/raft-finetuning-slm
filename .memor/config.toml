[memory]
schema_version = '1.0'
token_budget = 15000
wal_max_entries = 100
archive_after_days = 90

[compaction]
strategy = 'relevance_scored'
preserve_types = ['semantic', 'procedural', 'preference']
decay_types = ['episodic']

[compaction.type_weights]
preference = 1.0
semantic = 0.9
procedural = 0.8
episodic = 0.5
code = 0.7

[compaction.decay]
rate = 0.03
min_score = 0.1

[knowledge]
enabled = true
scan_paths = ['.github/**/*.md', 'CLAUDE.md', '.cursorrules', '.windsurfrules', '**/SKILL.md', '**/*.instructions.md', '**/*.rules.md', 'CONTRIBUTING.md']
extension_dirs = true
budget_share = 0.4

[hooks]
pre_commit = true
